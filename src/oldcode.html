    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
body {
  font-family: Arial, sans-serif;
  background: #f3e8ff;
  margin: 0;
  /* padding: 20px; */
  box-sizing: border-box;
  /* height: 100vh; */
  /* overflow: hidden; */
}

.main-container {
  display: grid;
  grid-template-columns: 350px 1fr; /* sidebar, container, video */
  gap: 20px;
  height: 100vh;
  max-width: 1200px !important;
  margin: auto;
  box-sizing: border-box;
  position: relative;
}


@media (max-width: 768px) {
    .main-container{
        grid-template-columns: 1fr !important;
    }
    .btn-sidebar{
        width: 340px !important;
        height: 230px !important;
        margin-top: 200px !important;

    }
    .container{
        height: 400px !important;
        width: 300px !important;
        margin: 30px auto 30px auto !important;

    }
    .to-corner {
  top: 1.5rem !important;
  left: 50% !important;
  right: auto !important;
  transform: translateX(-50%) !important;
  
}

}


/* Sidebar scrollable, fixed height */
.btn-sidebar {
  display: flex;
  justify-content: center; 
  flex-wrap: wrap;
  gap: 10px 10px;
  margin: auto;
  width: 250px;
  background-color: #fff;
  padding: 20px;
  overflow-y: auto;
  max-height: 100%;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* Main exam container (non-scrollable, fixed width) */
.container {
  background: #fff;
  padding: 20px;
  width: 100%;
  max-width: 700px !important;
  min-width: 350px !important;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  border-radius: 10px;
  overflow: hidden;
  height: 550px;
  margin: auto 0;
}

.container h1{
    text-align: center;
    margin: 10px 20px;
}

.container h3{
    margin-top: 30px;
    margin-bottom: 10px;
}

.option {
  margin: 10px 0;
  padding: 10px;
  margin: 10px;
  background: #f3e8ff;
  border-radius: 50px;
  cursor: pointer;
}

.option.selected {
  background: #e5ddee;
  border: 2px solid #50175d;
}
.option:hover{
    background-color: #e5ddee;
}

.navigation {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

.navigation button {
  padding: 10px 15px;
  cursor: pointer;
}
#prevBtn{
    background-color: #50175d ;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}
#nextBtn{
    background-color: #8e20f5;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}
#nextBtn:hover{
    background-color: #8100f9;
}
#prevBtn:hover{
    background-color: #460953 ;
}
#submitBtn {
  display: block;
  margin: 20px auto 0;
  padding: 10px 15px;
  font-size: 16px;
  cursor: pointer;
  border-radius: 8px;
  background: #007bff;
  color: #fff;
  border: none;
}
#submitBtn:hover{
    background: #136dce;
}

#timer {
  text-align: center;
  font-size: 16px;
  margin-bottom: 10px;
  color: white;
  font-weight: bold;
  background-color: rgb(18, 127, 18);
  padding: 10px 20px;
  border-radius: 20px;
  width: fit-content;
  margin: auto;
  transition: background-color 0.5s ease, transform 0.3s ease;
}

#timer.warning {
  background-color: rgb(175, 37, 37);
  animation: popup 0.7s infinite alternate;
}

@keyframes popup {
  0% { transform: scale(1); }
  100% { transform: scale(1.1); }
}


#sidebar button {
  padding: 8px;
  width: 50px;
  height: 50px;
  border: 3px solid gray;
  background: white;
  cursor: pointer;
  border-radius: 5px;
  font-weight: bold;
}

#sidebar button.active {
  background: #50175d;
  color: white;
}

#sidebar button.attempted {
  border: 3px solid rgb(53, 205, 46);
  
}
/* Custom Scrollbar for Sidebar */
.btn-sidebar::-webkit-scrollbar {
  width: 6px; /* thinner scrollbar */
}

/* Track (background of scrollbar) */
.btn-sidebar::-webkit-scrollbar-track {
  background: #f1f1f1;
  border-radius: 10px;
}

/* Thumb (actual draggable bar) */
.btn-sidebar::-webkit-scrollbar-thumb {
  background: #007bff;
  border-radius: 10px;
}

/* On hover */
.btn-sidebar::-webkit-scrollbar-thumb:hover {
  background: #0056b3;
}

/* Hide scrollbar arrows (top & bottom buttons) */
.btn-sidebar::-webkit-scrollbar-button {
  display: none;
}
.sidebar-info {
  width: 100%;
  margin-bottom: 15px;
  font-size: 16px;
  padding: 20px 10px;
  color: white;
 
  background: #50175d;
  border: 1px solid #ccc;
  border-radius: 8px;
  text-align: left;
}
.sidebar-info p{
    margin: 5px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}
#total-questions, #attempted-questions{
    color: #50175d;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: white;
    width: 30px;
    height: 30px;
    text-align: center;
    border-radius: 50%;
    font-weight: bold;
}

 

/* Video styling */
.camera-video {
  position: fixed;
  /* width: 300px; */
  width: 300px;
  background-color: white;
  border-radius: 8px;
  padding: 20px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  transition: all 1s ease;
  z-index: 9999;
}

/* Initial center position */
.center-start {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Final top-right corner */
.to-corner {
      top: 1.5rem ;
      left: auto ;
      right: 1.5rem ;
      width: 160px ;
      height: auto ;
      transform: none ;
    }
    #alertBox {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: none;
      width: 80%;
      max-width: 500px;
    }

    </style>

// ... previous question array code

let shuffledQuestions = [...questions].sort(() => Math.random() - 0.5);
let currentIndex = 0;
let selectedAnswers = Array(25).fill(null);
let correctCount = 0;
let incorrectCount = 0;
let attemptedCount = 0;
let countdown;
let isSubmitted = false; // ✅ Prevent multiple API calls
const startTime = new Date();

function startCountdown(durationInMinutes) {
  let timeLeft = durationInMinutes * 60;
  countdown = setInterval(() => {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    const timerEl = document.getElementById("timer");
    timerEl.innerText = `Time Left: ${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

    // Change color and add animation when 30s left
    if (timeLeft <= 30) {
      timerEl.classList.add("warning");
    }

    timeLeft--;

    if (timeLeft < 0 && !isSubmitted) {
      clearInterval(countdown);
      submitExam();
    }
  }, 1000);
}

function renderQuestion(index) {
  const container = document.getElementById("question-container");
  const q = shuffledQuestions[index];

  container.innerHTML = `
    <h3>Q${index + 1}: ${q.question}</h3>
    ${q.options.map((opt, i) => {
      const selectedClass = selectedAnswers[index] === opt ? "selected" : "";
      const label = String.fromCharCode(65 + i); // A, B, C, D
      return `
        <div class="option ${selectedClass}" onclick="selectOption(${index}, '${opt}')">
          <strong>${label}.</strong> ${opt}
        </div>
      `;
    }).join("")}
  `;

  document.getElementById("prevBtn").style.display = index === 0 ? "none" : "inline-block";
  document.getElementById("nextBtn").style.display = index === shuffledQuestions.length - 1 ? "none" : "inline-block";
  document.getElementById("submitBtn").style.display = index === shuffledQuestions.length - 1 ? "block" : "none";

  renderSidebar();
}


function renderSidebar() {
  const sidebar = document.getElementById("sidebar");
  
  // Count update
  document.getElementById("total-questions").innerText = shuffledQuestions.length;
  document.getElementById("attempted-questions").innerText = selectedAnswers.filter(ans => ans !== null).length;

  // Remove old buttons before adding again
  sidebar.querySelectorAll("button").forEach(btn => btn.remove());

  for (let i = 0; i < shuffledQuestions.length; i++) {
    const btn = document.createElement("button");
    btn.innerText = i + 1;

    if (i === currentIndex) {
      btn.classList.add("active");
    }

    if (selectedAnswers[i]) {
      btn.classList.add("attempted");
    }

    btn.onclick = () => {
      currentIndex = i;
      renderQuestion(currentIndex);
      renderSidebar(); // Re-render sidebar to update highlight
    };

    sidebar.appendChild(btn);
  }
}


function selectOption(index, option) {
  selectedAnswers[index] = option;
  renderQuestion(index);
}

function nextQuestion() {
  if (currentIndex < shuffledQuestions.length - 1) {
    currentIndex++;
    renderQuestion(currentIndex);
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion(currentIndex);
  }
}

// reload and alert logic---------------------
let warningCount = 0;

  // Disable F5, Ctrl+R and drag reload
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F5' ||
      (e.ctrlKey && e.key.toLowerCase() === 'r')
    ) {
      e.preventDefault();
    }
  });

  // Optional: Also stop drag-drop refresh (Mac style)
  window.addEventListener("dragover", function(e) {
    e.preventDefault();
  });
  window.addEventListener("drop", function(e) {
    e.preventDefault();
  });

  // Show warning alert
  function showAlert(msg) {
    const alertBox = document.getElementById("alertBox");
    const alertMsg = document.getElementById("alertMsg");
    alertMsg.innerText = msg;
    alertBox.style.display = "block";
    setTimeout(() => {
      hideAlert();
    }, 20000);
  }

  function hideAlert() {
    const alertBox = document.getElementById("alertBox");
    alertBox.style.display = "none";
  }

  // Detect tab switching or page hidden
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      warningCount++;
      if (warningCount === 1) {
        showAlert("⚠️ Warning 1: Please do not leave the exam page!");
      } else if (warningCount === 2) {
        showAlert("⚠️ Warning 2: This is your second warning!");
      } else if (warningCount === 3) {
        submitExam(); // Call your auto-submit
      }
    }
  });
// reload and alert logic end ^^^^^^^-----------------------------

function submitExam() {
  if (isSubmitted) return; // ✅ Prevent multiple submissions
  isSubmitted = true;
  clearInterval(countdown);

  const endTime = new Date();
  correctCount = 0;
  incorrectCount = 0;
  attemptedCount = 0;

  selectedAnswers.forEach((answer, idx) => {
    if (answer) {
      attemptedCount++;
      if (answer === shuffledQuestions[idx].answer) {
        correctCount++;
      } else {
        incorrectCount++;
      }
    }
  });

  const totalQuestions = shuffledQuestions.length;
  const totalMarks = correctCount * 5;

  const startTimeStr = startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const endTimeStr = endTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const durationInMinutes = Math.round((endTime - startTime) / 60000);

  const email = localStorage.getItem("userEmail");

  const result = {
    email,
    attempted: attemptedCount,
    correct: correctCount,
    incorrect: incorrectCount,
    totalQuestions: totalQuestions,
    totalMarks: totalMarks,
    examDate: new Date().toISOString().split("T")[0],
    startTime: startTimeStr,
    endTime: endTimeStr,
    duration: `${durationInMinutes} minutes`
  };

  fetch("http://localhost:5000/api/user/submit-exam", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(result),
  })
    .then(res => {
      if (!res.ok) {
        return res.json().then(err => { throw new Error(err.message || "Server Error"); });
        console.log("hello");
      }
      return res.json();
      console.log("byy");
    })
    .then(data => {
      Swal.fire({
        title: "Success!",
        text: "Your exam has been submitted.",
        icon: "success",
        confirmButtonText: "OK"
        
      }).then(() => {
        // window.location.href = "info.html";
        console.log("jsjsj")
        console.log(email)
      });
    })
    .catch(error => {
      Swal.fire({
        title: "Submission Failed",
        text: error.message || "Something went wrong. Please try again later.",
        icon: "error",
        confirmButtonText: "OK"
      });
      console.log(error);
    });
}

      <!-- cemera open script-------------------------- -->
      <script>
        const permissionGiven = sessionStorage.getItem("cameraMicAllowed");
      
        if (!permissionGiven) {
          alert("⚠️ Unauthorized access! Redirecting...");
          window.location.href = "index.html";
        } else {
          navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
              const video = document.createElement("video");
              video.autoplay = true;
              video.muted = true;
              video.playsInline = true;
              video.srcObject = stream;
      
              // Add CSS classes
              video.classList.add("camera-video", "center-start");
      
              // Append to .main-container
              const container = document.querySelector(".main-container");
              container.appendChild(video);
      
              // Smooth transition to corner
              setTimeout(() => {
                video.classList.remove("center-start");
                video.classList.add("to-corner");
              }, 1000);
            })
            .catch(() => {
              alert("❌ Camera/Mic access failed.");
            });
        }
      </script>
